name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    # O núcleo é portátil (ADR-0010): precisa passar no Windows e no Linux.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # o app desktop (Tauri) fica fora do workspace: job `desktop` abaixo
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  docs-e-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Links relativos e âncoras
        run: node scripts/check-docs.js
      - name: Sintaxe dos módulos da UI
        run: for f in ui/js/*.js; do node --check "$f"; done

  desktop:
    # app Tauri fora do workspace (dependência do WebView2): só verifica que compila
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop
      - run: cargo check --locked
        working-directory: apps/desktop
