name: release

# E4: instalador do Windows (NSIS) sem assinatura. Dispara ao criar uma tag `v*` (ex.: v0.1.0).
# A assinatura fica para o W9 (docs/RISKS-AND-SPIKES.md): sem ela o SmartScreen avisa, então o
# release publica também o checksum SHA-256 (docs/SECURITY.md, R9).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop
      - name: Instalar o tauri-cli
        run: cargo install tauri-cli --version "^2" --locked
      - name: Gerar o instalador
        working-directory: apps/desktop
        run: cargo tauri build --bundles nsis
      - name: Checksum
        shell: pwsh
        run: |
          $files = Get-ChildItem apps/desktop/target/release/bundle/nsis/*.exe
          foreach ($f in $files) { "$((Get-FileHash $f -Algorithm SHA256).Hash.ToLower())  $($f.Name)" | Out-File -Append -Encoding ascii apps/desktop/target/release/bundle/nsis/SHA256SUMS.txt }
          Get-Content apps/desktop/target/release/bundle/nsis/SHA256SUMS.txt
      - name: Guardar como artefato
        uses: actions/upload-artifact@v4
        with:
          name: insert-disc-windows
          path: |
            apps/desktop/target/release/bundle/nsis/*.exe
            apps/desktop/target/release/bundle/nsis/SHA256SUMS.txt
      - name: Publicar no release (só em tag)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --notes "Instalador do Windows sem assinatura. Confira o SHA-256 em SHA256SUMS.txt; o SmartScreen pode avisar (W9)." apps/desktop/target/release/bundle/nsis/*.exe apps/desktop/target/release/bundle/nsis/SHA256SUMS.txt
