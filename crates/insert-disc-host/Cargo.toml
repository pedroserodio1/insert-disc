[package]
name = "insert-disc-host"
version = "0.0.0"
description = "Camada entre a UI e o núcleo: API JSON (UI-CONTRACT), lançador e dados de demonstração. Sem Tauri."
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false
default-run = "insert-disc-dev"

[dependencies]
insert-disc-core = { path = "../insert-disc-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
tiny_http = "0.12"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
base64 = "0.23.1"

[[bin]]
name = "insert-disc-dev"
path = "src/bin/dev.rs"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_Debug"] }
