[package]
name = "insert-disc-host"
version = "0.0.0"
description = "Camada entre a UI e o núcleo: API JSON (UI-CONTRACT), lançador e dados de demonstração. Sem Tauri."
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false
default-run = "insert-disc-dev"

[dependencies]
insert-disc-core = { path = "../insert-disc-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
tiny_http = "0.12"

[[bin]]
name = "insert-disc-dev"
path = "src/bin/dev.rs"
